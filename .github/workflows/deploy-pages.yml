name: Deploy Seringa to GitHub Pages

# Publicação ÚNICA do site + app do Seringa (18/11/2026).
#   /          -> site novo (pasta site/)
#   /app/      -> app PWA (instala a partir do site, atualiza sozinho)
#   /antigo/   -> versão anterior (frontend/static), guardada para quem ainda a usa
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        shell: bash
        run: |
          rm -rf _publicar
          mkdir -p _publicar/antigo
          cp -R site/. _publicar/
          cp -R frontend/static/. _publicar/antigo/
          touch _publicar/.nojekyll
          echo site-pronto
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
