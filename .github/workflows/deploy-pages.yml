name: Deploy Seringa to GitHub Pages

# Publicação ÚNICA do site + app do Seringa (MVP final, 18/11/2026).
#   /          -> site (pasta site/)
#   /app/      -> app PWA (instala a partir do site, atualiza sozinho)
#   /antigo/   -> página de transição: deixa baixar os dados da versão anterior e desativa o service worker antigo.
#                 A versão anterior (frontend/static) NÃO é publicada: tinha conversão de dose e portão de ativação,
#                 proibidos pelo Documento do Produto v1.1. O código fica guardado no repositório e no branch backup/pre-mvp-final-2026-11-18.
#   site/testes/ -> testes automáticos (node site/testes/executar.js); não são publicados.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        shell: bash
        run: |
          rm -rf _publicar
          mkdir -p _publicar
          cp -R site/. _publicar/
          rm -rf _publicar/testes
          touch _publicar/.nojekyll
          echo site-pronto
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
