<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16a34a"><title>Seringa</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="theme.css?v=8"></head>
<body class="min-h-screen bg-gradient-to-b from-green-50 to-gray-100 text-gray-800"><div class="site-header"><div class="wrap site-nav"><a class="site-brand" href="index.html"><span>SERINGA</span></a><nav class="site-navlinks"><a href="index.html#projeto">Projeto</a><a href="index.html#seguranca">Segurança</a></nav><div class="site-actions"><button type="button" class="theme-toggle" data-theme-toggle></button></div></div></div></div></div><main class="min-h-screen flex items-center justify-center p-5"><section class="w-full max-w-sm rounded-3xl bg-white p-7 shadow-xl text-center"><div class="syringe-logo" aria-label="Símbolo de seringa" role="img"><img src="logo.svg" alt="" width="48" height="48"></div><h1 class="text-4xl font-black text-green-600">Seringa</h1><p class="mt-2 mb-8 text-sm text-gray-500">Controlo Fácil de Aplicações</p>
<label for="codigo" class="mb-2 block text-left text-sm font-bold">Código de Ativação</label><input id="codigo" autocomplete="off" autocapitalize="characters" placeholder="Insira o seu código" class="mb-4 h-14 w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 text-center text-lg font-bold uppercase tracking-widest outline-none focus:ring-4 focus:ring-green-100">
<button onclick="ativar()" class="w-full rounded-2xl bg-green-600 py-4 font-black text-white shadow-lg hover:bg-green-700">ATIVAR ACESSO</button><button onclick="gratuito()" class="mt-4 w-full py-3 text-sm text-gray-500 underline hover:text-green-600">Continuar com versão Gratuita</button></section></main>
<script>const CODE='DBA66369';function ativar(){const c=document.getElementById('codigo').value.replace(/\s/g,'').toUpperCase();if(c===CODE){localStorage.setItem('seringaStatus','premium');location.href='inicio.html'}else alert('Código inválido. Tente novamente.')}function gratuito(){localStorage.setItem('seringaStatus','free');location.href='app.html'}document.getElementById('codigo').addEventListener('keydown',e=>{if(e.key==='Enter')ativar()});</script><script src="theme.js?v=8"></script></body></html>
