<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seringa Saúde — Relatório</title><link rel="stylesheet" href="theme.css?v=12"><link rel="stylesheet" href="seringa-ui.css?v=3"><style>body{background:#f3fbf9;color:#123b45;font-family:system-ui;margin:0}.report{max-width:760px;margin:auto;padding:28px}.box{background:#fff;border:1px solid #dcefeb;border-radius:20px;padding:20px;margin:14px 0}.no-print button{border:0;border-radius:14px;padding:12px 18px;font-weight:800;margin-right:8px}@media print{.no-print{display:none!important}body{background:#fff}.box{box-shadow:none}}</style></head><body><main class="report"><div class="no-print" style="margin-bottom:18px"><button type="button" class="theme-toggle" data-theme-toggle>Escuro</button><button onclick="history.back()">← Voltar</button><button onclick="location.href='inicio.html'">⌂ Início</button><button onclick="window.print()">📥 Guardar como PDF</button><button onclick="enviar()">✉️ Preparar e-mail</button></div><header class="box"><div style="display:flex;gap:12px;align-items:center"><img src="logo-seringa-3d.svg?v=20260921" width="58" height="58" alt="Seringa Saúde"><div><h1 style="margin:0">Seringa Saúde</h1><p style="margin:4px 0">Relatório de acompanhamento</p></div></div></header><section class="box"><h2>Perfil</h2><p><strong>Nome:</strong> <span id="rNome">—</span></p><p><strong>E-mail:</strong> <span id="rEmail">—</span></p><p><strong>Gerado em:</strong> <span id="rData"></span></p></section><section class="box"><h2>Registos</h2><div id="dados"></div></section><section class="box"><h2>Nota</h2><p>Este relatório organiza registos introduzidos pelo utilizador. Não constitui diagnóstico, prescrição ou orientação clínica.</p></section></main><script>const p=JSON.parse(localStorage.getItem('seringaPerfil')||'{}');rNome.textContent=p.nome||'Não preenchido';rEmail.textContent=p.email||'Não preenchido';rData.textContent=new Date().toLocaleString('pt-PT');const records=JSON.parse(localStorage.getItem('seringaRecords')||'[]');const lemb=JSON.parse(localStorage.getItem('seringaLembretes')||'[]');let h='';if(records.length)h+='<h3>Aplicações recentes</h3>'+records.slice(0,20).map(x=>'<p>'+esc(x[0])+' · '+esc(x[1])+' · '+esc(x[2])+'</p>').join('');if(lemb.length)h+='<h3>Lembretes</h3>'+lemb.map(x=>'<p>'+esc(x.titulo)+' · '+esc(x.criado)+'</p>').join('');if(!h)h='<p>Não existem registos gerais disponíveis.</p>';dados.innerHTML=h;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function enviar(){if(!p.email)return alert('Guarde primeiro o seu e-mail no Perfil.');location.href='mailto:'+encodeURIComponent(p.email)+'?subject='+encodeURIComponent('Relatório Seringa Saúde — '+(p.nome||''))+'&body='+encodeURIComponent('Olá,\n\nEnvio o meu relatório do Seringa Saúde.\n\nCumprimentos,\n'+(p.nome||''))}</script><script src="seringa-modules.js?v=2" defer></script></body></html>
