<!doctype html>
<html lang="pt-PT"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F8F7"><title>Seringa Saúde — Registos</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="theme.js?v=12"></script><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css?v=12"><link rel="stylesheet" href="seringa-modules.css?v=4"><link rel="stylesheet" href="seringa-ui.css?v=3">
<script src="seringa-shield.js?v=2"></script>
</head>
<body class="min-h-screen">
<header class="site-header"><div class="wrap site-nav"><a class="site-brand" href="inicio.html"><span>SERINGA SAÚDE</span></a><div class="site-actions"><button type="button" class="theme-toggle" data-theme-toggle></button><button onclick="sair()" class="secondary rounded-full px-4 py-2 text-xs font-black">Sair</button></div></div></header>
<main class="mx-auto max-w-md px-5 pb-28 pt-5">
<section class="card rounded-3xl p-5"><div class="flex items-center justify-between mb-4"><div><span class="text-xs font-black uppercase text-emerald-600">Registos</span><h1 class="text-2xl font-black">Nova aplicação</h1></div><span class="ss-icon grid h-12 w-12 place-items-center rounded-2xl text-2xl" aria-hidden="true">✚</span></div>
<div class="grid grid-cols-2 gap-3"><label class="text-xs font-bold">Data<input type="date" id="newDate" class="mt-1 w-full rounded-xl p-3"></label><label class="text-xs font-bold">Hora<input type="time" id="newTime" class="mt-1 w-full rounded-xl p-3"></label></div>
<label class="mt-3 block text-xs font-bold">Local da aplicação<select id="newSite" class="mt-1 w-full rounded-xl p-3"><option>Abdómen Esquerdo</option><option>Abdómen Direito</option><option>Coxa Esquerda</option><option>Coxa Direita</option><option>Braço Esquerdo</option><option>Braço Direito</option><option>Glúteo</option></select></label>
<button onclick="adicionarRegisto()" class="mt-4 w-full rounded-2xl py-3 font-black bg-emerald-600 text-white">GUARDAR REGISTO</button></section>
<section class="card mt-4 rounded-3xl p-5"><div class="flex items-center justify-between mb-4"><div><span class="text-xs font-black uppercase text-emerald-600">Última aplicação</span><h2 class="mt-1 text-xl font-black">Resumo</h2></div><span class="ss-icon grid h-12 w-12 place-items-center rounded-2xl text-2xl" aria-hidden="true">✓</span></div>
<div class="grid grid-cols-2 gap-3"><div class="rounded-2xl bg-gray-50 p-4"><p class="text-xs">Data</p><p id="date" class="mt-1 font-bold">--/--/----</p></div><div class="rounded-2xl bg-gray-50 p-4"><p class="text-xs">Hora</p><p id="time" class="mt-1 font-bold">--:--</p></div></div>
<div class="mt-3 rounded-2xl bg-emerald-50 p-4"><p class="text-xs">Local da aplicação</p><p id="site" class="mt-1 font-black">Nenhum registo ainda</p></div></section>
<section class="card mt-4 rounded-3xl p-5"><div class="flex items-center justify-between"><span class="text-xs font-black uppercase text-emerald-600">Histórico</span><button onclick="limparHistorico()" class="text-xs font-black text-red-600 underline">Limpar</button></div><h2 class="mt-1 text-xl font-black">Últimas aplicações</h2><div id="history" class="mt-4 divide-y"></div></section>
</main>
<nav class="ss-bottom-nav no-print" aria-label="Navegação principal"><a href="inicio.html"><span>⌂</span>Início</a><a href="app.html" class="active"><span>✓</span>Registos</a><a href="calendario.html"><span>▣</span>Calendário</a><a href="perfil.html"><span>♙</span>Perfil</a></nav>
<script>
const $=id=>document.getElementById(id);
function initForm(){const now=new Date();if(!$('newDate').value)$('newDate').value=now.toISOString().slice(0,10);if(!$('newTime').value)$('newTime').value=now.toTimeString().slice(0,5)}
function render(){const saved=JSON.parse(localStorage.getItem('seringaRecords')||'[]');const rows=saved.slice(0,10);$('date').textContent=rows[0]?.[0]||'--/--/----';$('time').textContent=rows[0]?.[1]||'--:--';$('site').textContent=rows[0]?.[2]||'Nenhum registo ainda';$('history').innerHTML=rows.length?rows.map(r=>'<div class="flex justify-between gap-3 py-3 text-sm"><span>'+r[0]+' · '+r[1]+'</span><b>'+r[2]+'</b></div>').join(''):'<p class="py-4 text-sm muted">Ainda não existem registos.</p>'}
function adicionarRegisto(){const d=$('newDate').value,t=$('newTime').value,s=$('newSite').value;if(!d||!t){alert('Indique a data e a hora.');return}const p=d.split('-');const f=p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;const a=JSON.parse(localStorage.getItem('seringaRecords')||'[]');a.unshift([f,t,s]);localStorage.setItem('seringaRecords',JSON.stringify(a.slice(0,30)));render()}
function limparHistorico(){if(confirm('Apagar todos os registos deste dispositivo?')){localStorage.removeItem('seringaRecords');render()}}
function sair(){localStorage.removeItem('seringaStatus');location.href='index.html'}
initForm();render();
</script><script src="seringa-modules.js?v=3" defer></script></body></html>
