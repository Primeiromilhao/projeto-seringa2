<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seringa - Insights Premium</title><script src="https://cdn.tailwindcss.com"></script>
<style>.tab-ativa{border-bottom:2px solid #10B981;color:#10B981}.tab-inativa{color:#64748B;border-bottom:2px solid transparent}.escondido{display:none}input{font-size:16px!important}@media print{body{background:#fff!important;color:#111!important}.no-print{display:none!important}}</style>
<link rel="stylesheet" href="theme.css?v=4?v=3"></head>
<body class="bg-[#111827] text-white font-sans min-h-screen p-4 flex flex-col items-center"><div class="site-header"><div class="wrap site-nav"><span class="site-brand">SERINGA</span><div class="site-actions"><button type="button" class="theme-toggle" data-theme-toggle>☾ Escuro</button></div></div></div><main class="w-full max-w-md">
<header class="flex items-center gap-3 mb-4 pt-2 pb-2"><button onclick="window.history.back()" class="text-slate-400 text-2xl font-bold p-2 -ml-2">â†</button><h1 class="text-xl font-bold text-slate-100">ðŸ’Ž Insights Premium</h1></header>
<div class="flex w-full mb-6 border-b border-slate-800"><button id="btnTermico" onclick="mudarTab('termico')" class="flex-1 pb-3 text-sm font-bold uppercase tracking-wider tab-ativa">Mapa Térmico</button><button id="btnDossie" onclick="mudarTab('dossie')" class="flex-1 pb-3 text-sm font-bold uppercase tracking-wider tab-inativa">Diário Visual</button></div>
<section id="tabTermico" class="space-y-6"><div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-lg text-center"><p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">Mapa de Registos</p><p class="text-sm text-slate-300 mb-6">Resumo dos registos de reaçÃµes por zona.</p>
<div class="relative w-full h-[280px] flex justify-center mb-4"><svg viewBox="0 0 200 300" class="absolute inset-0 w-full h-full text-slate-700 opacity-50"><circle cx="100" cy="30" r="25" fill="currentColor"/><rect x="85" y="45" width="30" height="40" fill="currentColor" rx="10"/><path d="M50 75C20 75 10 100 15 130L35 280C38 295 162 295 165 280L185 130C190 100 180 75 150 75Z" fill="currentColor"/></svg>
<div id="mapa" class="absolute top-[120px] w-32 h-36 border-2 border-slate-600 rounded-2xl grid grid-cols-2 grid-rows-3 gap-1 overflow-hidden z-10 p-1"></div></div>
<div id="insight" class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 text-left"></div></div>
<div class="flex justify-center gap-4 text-xs font-medium text-slate-400"><span>ðŸŸ¢ Mais registos</span><span>ðŸŸ¡ Poucos registos</span><span>âšª Sem dados</span></div></section>
<section id="tabDossie" class="space-y-4 escondido"><button onclick="adicionarFoto()" class="w-full bg-slate-800 border-2 border-dashed border-slate-600 rounded-2xl p-6 flex flex-col items-center justify-center"><div class="w-14 h-14 bg-slate-900 rounded-full flex items-center justify-center text-2xl mb-3">ðŸ“¸</div><p class="font-bold text-green-400">Adicionar Foto de Reação</p><p class="text-xs text-slate-400 mt-1">Anexe uma imagem para mostrar ao profissional de saúde</p></button><input id="fotoInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="guardarFoto(event)"><div class="flex justify-between items-end px-1 mb-2 mt-4"><h2 class="text-xs text-slate-400 font-bold uppercase tracking-wider">Histórico Fotográfico</h2><button onclick="limparFotos()" class="text-[10px] text-slate-500 hover:text-red-400">Limpar tudo</button></div><div id="fotos" class="space-y-3"></div></section>
</main>
<script>
if(localStorage.getItem('seringaStatus')!=='premium')location.href='index.html';
const KEY='seringaInsightsFotos';
function mudarTab(t){const a=t==='termico';document.getElementById('tabTermico').classList.toggle('escondido',!a);document.getElementById('tabDossie').classList.toggle('escondido',a);document.getElementById('btnTermico').className='flex-1 pb-3 text-sm font-bold uppercase tracking-wider '+(a?'tab-ativa':'tab-inativa');document.getElementById('btnDossie').className='flex-1 pb-3 text-sm font-bold uppercase tracking-wider '+(a?'tab-inativa':'tab-ativa');}
function dados(){return JSON.parse(localStorage.getItem('seringaHistorico')||'[]');}
function mapa(){const zs=['Superior Esquerdo','Superior Direito','Médio Esquerdo','Médio Direito','Inferior Esquerdo','Inferior Direito'];const h=dados();const counts=zs.map(z=>h.filter(x=>x.local===z).length);document.getElementById('mapa').innerHTML=zs.map((z,i)=>{const n=counts[i];const c=n===0?'bg-slate-600/50':n<3?'bg-amber-500/70':'bg-emerald-500/70';return '<div title="'+z+'" class="'+c+' rounded flex items-center justify-center text-[9px] font-bold">'+(n?'Registos '+n:'Sem dados')+'</div>';}).join('');
const total=h.length;document.getElementById('insight').innerHTML='<div class="flex items-start gap-3"><div class="text-2xl">ðŸ’¡</div><div><p class="font-bold text-emerald-400 text-sm mb-1">Resumo dos seus registos</p><p class="text-xs text-slate-300 leading-relaxed">'+(total?'Existem '+total+' registo(s) guardado(s). O mapa mostra apenas a quantidade de registos por zona; não determina eficácia, reação ou dose.':'Ainda não existem registos suficientes para apresentar um resumo.')+'</p></div></div>';}
function adicionarFoto(){document.getElementById('fotoInput').click();}
function limparFotos(){if(confirm('Eliminar todas as fotos guardadas neste dispositivo?')){localStorage.removeItem(KEY);renderFotos();document.getElementById('fotoInput').value='';}}

function guardarFoto(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){alert('A imagem é demasiado grande. Escolha uma foto até 2 MB.');e.target.value='';return;}const r=new FileReader();r.onload=()=>{const arr=JSON.parse(localStorage.getItem(KEY)||'[]');arr.unshift({data:new Date().toLocaleDateString('pt-PT'),nome:f.name,src:r.result});localStorage.setItem(KEY,JSON.stringify(arr));renderFotos();};r.readAsDataURL(f);}
function renderFotos(){const arr=JSON.parse(localStorage.getItem(KEY)||'[]');document.getElementById('fotos').innerHTML=arr.map((x,i)=>'<div class="bg-slate-800 rounded-2xl border border-slate-700 p-3 flex gap-3 items-center"><img src="'+x.src+'" alt="Foto de reação" class="w-20 h-20 object-cover rounded-xl border border-slate-600"><div class="flex-1"><p class="text-[10px] text-slate-400 font-bold">'+esc(x.data)+'</p><p class="font-bold text-slate-200 text-sm mt-1">'+esc(x.nome)+'</p><button onclick="apagarFoto('+i+')" class="text-xs text-red-400 mt-2">Eliminar</button></div></div>').join('')||'<p class="text-sm text-slate-500 text-center py-6">Nenhuma foto registada.</p>';}
function apagarFoto(i){const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));renderFotos();}
function esc(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
mapa();renderFotos();
</script><script src="theme.js?v=4"></script></body></html>
