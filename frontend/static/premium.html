<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>Seringa - Premium</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white"><header class="border-b border-slate-800"><div class="mx-auto flex max-w-md items-center justify-between px-5 py-4"><div class="flex items-center gap-3"><span class="text-2xl">💉</span><h1 class="text-2xl font-black text-green-400">Seringa</h1></div><span class="rounded-full bg-green-500 px-3 py-1 text-[10px] font-black uppercase text-slate-950">Conta Premium Ativa</span></div></header>
<main class="mx-auto max-w-md px-5 pb-28 pt-5"><section class="mb-4 rounded-3xl border border-slate-700 bg-slate-900 p-5"><span class="text-xs font-black tracking-wider text-green-400">PLANO DE ROTAÇÃO</span><h2 class="mt-1 text-2xl font-black">Próximo local sugerido</h2><div class="mt-5 flex items-center gap-5"><div class="relative grid h-64 w-40 place-items-center rounded-2xl bg-slate-800"><span class="text-[120px] grayscale">🧍</span><span id="mark" class="absolute left-1/2 top-[44%] h-7 w-7 -translate-x-1/2 rounded-lg bg-green-400 ring-4 ring-green-200/30"></span></div><div><p class="text-sm text-slate-400">Depois das aplicações anteriores:</p><strong id="next" class="mt-1 block text-xl text-green-400">Abdómen Direito</strong><button onclick="proximo()" class="mt-4 rounded-xl bg-green-500 px-4 py-3 font-black text-slate-950">🔄 Próximo local</button></div></div><div class="mt-4 grid grid-cols-2 gap-2 text-xs"><span class="rounded-lg bg-slate-800 p-3">Braços ✓</span><span class="rounded-lg bg-slate-800 p-3">Abdómen ✓</span><span class="rounded-lg bg-slate-800 p-3">Coxas ✓</span><span class="rounded-lg bg-green-950 p-3 text-green-300">Sugestão ativa</span></div></section>
<section class="grid gap-3"><button onclick="abrir('history')" class="flex items-center justify-between rounded-2xl bg-slate-900 p-5 text-left"><span>📋 <b>Histórico Ilimitado</b><small class="mt-1 block text-xs text-slate-400">Todas as aplicações registadas</small></span><span>›</span></button><button onclick="abrir('reminders')" class="flex items-center justify-between rounded-2xl bg-slate-900 p-5 text-left"><span>📅 <b>Lembretes</b><small class="mt-1 block text-xs text-slate-400">Organize próximas aplicações</small></span><span>›</span></button><button onclick="abrir('stock')" class="flex items-center justify-between rounded-2xl bg-slate-900 p-5 text-left"><span>💉 <b>Estoque de Canetas</b><small class="mt-1 block text-xs text-slate-400">Controle unidades disponíveis</small></span><span>›</span></button><button onclick="abrir('validity')" class="flex items-center justify-between rounded-2xl bg-slate-900 p-5 text-left"><span class="text-amber-300">⚠️ <b>Avisos de Validade</b><small class="mt-1 block text-xs text-slate-400">Confira datas importantes</small></span><span>›</span></button></section>
<section id="panel" class="mt-4 hidden rounded-3xl bg-white p-5 text-slate-800"><div class="flex justify-between"><span class="text-xs font-black text-green-700">PAINEL PREMIUM</span><button onclick="fechar()">×</button></div><h2 id="panelTitle" class="mt-2 text-2xl font-black"></h2><div id="panelBody" class="mt-3 text-sm text-slate-600"></div></section>
<button onclick="gerarPDF()" class="mt-5 w-full rounded-2xl bg-green-500 py-4 font-black text-slate-950">📄 GERAR RELATÓRIO PDF</button><button onclick="sair()" class="mt-3 w-full rounded-xl border border-slate-700 py-3 text-sm font-bold text-slate-400">Sair da Conta Premium</button></main>
<script>if(localStorage.getItem('seringaStatus')!=='premium')location.href='index.html';const sites=['Abdómen Direito','Abdómen Esquerdo','Coxa Direita','Coxa Esquerda','Braço Direito','Braço Esquerdo'];let i=0;function proximo(){i=(i+1)%sites.length;document.getElementById('next').textContent=sites[i];localStorage.setItem('seringaNextSite',sites[i])}function abrir(type){const data={history:['Histórico Ilimitado','Consulte todos os registos guardados neste dispositivo.'],reminders:['Lembretes','Agende a próxima aplicação e receba um lembrete no dispositivo.'],stock:['Estoque de Canetas','Registe unidades e acompanhe o seu estoque.'],validity:['Avisos de Validade','Registe datas de validade e reveja os itens que precisam de atenção.']};document.getElementById('panelTitle').textContent=data[type][0];document.getElementById('panelBody').textContent=data[type][1];document.getElementById('panel').classList.remove('hidden')}function fechar(){document.getElementById('panel').classList.add('hidden')}function gerarPDF(){window.print()}function sair(){localStorage.removeItem('seringaStatus');location.href='index.html'}document.getElementById('next').textContent=localStorage.getItem('seringaNextSite')||sites[0];</script></body></html>
