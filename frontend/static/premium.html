<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seringa - Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen p-4 text-white">
<header class="flex justify-between items-center mb-6 pt-2 max-w-md mx-auto">
<div class="flex items-center gap-2"><span class="text-2xl">💉</span><h1 class="text-2xl font-bold text-green-400">Seringa</h1></div>
<button onclick="sair()" class="bg-slate-800 text-xs font-bold px-4 py-2 rounded-full text-slate-300 border border-slate-700">Sair</button>
</header>
<main class="max-w-md mx-auto">
<section class="bg-[#1e293b] p-6 rounded-2xl mb-4 border border-slate-700 shadow-lg">
<h2 class="text-sm text-slate-400 font-semibold uppercase tracking-wider mb-4 text-center">Local Sugerido (Abdómen)</h2>
<div class="relative w-48 h-48 mx-auto bg-slate-700 rounded-full border-4 border-slate-600 flex items-center justify-center mb-6">
<div class="w-4 h-4 bg-slate-900 rounded-full z-10"></div><div class="absolute w-full h-0.5 bg-slate-600"></div><div class="absolute h-full w-0.5 bg-slate-600"></div>
<div id="q0" class="absolute top-4 right-8 w-6 h-6 rounded-full"></div><div id="q1" class="absolute top-4 left-8 w-6 h-6 rounded-full"></div><div id="q2" class="absolute bottom-4 left-8 w-6 h-6 rounded-full"></div><div id="q3" class="absolute bottom-4 right-8 w-6 h-6 rounded-full"></div>
</div>
<p class="text-center text-2xl font-bold text-green-400 mb-1" id="nomeQuadrante">Superior Direito</p><p class="text-center text-xs text-slate-400">Rodízio em círculo pelos quadrantes do abdómen.</p>
</section>
<section class="grid grid-cols-2 gap-4 mb-6"><div class="bg-slate-800 p-4 rounded-2xl border border-slate-700"><p class="text-xs text-slate-400 uppercase">Dose Atual</p><p class="text-2xl font-bold"><span id="valorDose">2.5</span> <span class="text-sm font-normal text-slate-400">mg</span></p><p class="text-xs text-amber-400" id="avisoSemana">Semana 1 de 4</p></div><div class="bg-slate-800 p-4 rounded-2xl border border-slate-700"><p class="text-xs text-slate-400 uppercase">Na Caneta</p><p class="text-2xl font-bold"><span id="valorStock">4</span> <span class="text-sm font-normal text-slate-400">doses</span></p><p class="text-xs text-green-400" id="avisoStock">Stock seguro</p></div></section>
<button onclick="registarAplicacao()" class="w-full bg-green-500 text-slate-900 text-lg font-bold py-5 rounded-2xl hover:bg-green-400 transition shadow-lg flex justify-center items-center gap-2">💉 Registar Aplicação de Hoje</button>
<section class="mt-4 bg-slate-800 rounded-2xl p-2 border border-slate-700"><button onclick="mostrar('hist')" class="w-full flex justify-between p-4 border-b border-slate-700"><span>📋 Histórico Ilimitado</span><span>›</span></button><button onclick="mostrar('cal')" class="w-full flex justify-between p-4 border-b border-slate-700"><span>📅 Calendário e Lembretes</span><span>›</span></button><button onclick="mostrar('stock')" class="w-full flex justify-between p-4 border-b border-slate-700"><span>🖋️ Estoque de Canetas</span><span>›</span></button><button onclick="mostrar('valid')" class="w-full flex justify-between p-4"><span class="text-amber-400">⚠️ Avisos de Validade</span><span>›</span></button></section>
<button onclick="gerarPDF()" class="w-full mt-5 bg-slate-800 text-green-400 border border-green-500/30 font-bold py-4 rounded-xl">📄 GERAR RELATÓRIO PDF</button>
</main>
<div id="modal" class="hidden fixed inset-0 bg-black/70 items-center justify-center p-4 z-50">
<div class="w-full max-w-sm rounded-3xl bg-[#1e293b] p-6 border border-slate-600"><div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold">Registar Aplicação</h3><button onclick="fechar()" class="text-slate-400 text-xl">✕</button></div>
<div class="grid grid-cols-2 gap-3"><label class="bg-slate-800 p-3 rounded-xl">Dose<input id="dose" value="20 mg" class="mt-1 w-full bg-transparent font-bold outline-none"></label><label class="bg-slate-800 p-3 rounded-xl">Agulha<input value="20 G" readonly class="mt-1 w-full bg-transparent text-green-400 font-bold outline-none"></label></div>
<div class="bg-slate-800 p-3 rounded-xl mt-3"><span class="text-xs text-slate-400">Local do rodízio</span><p id="modalLocal" class="font-bold mt-1">Superior Direito</p></div>
<div class="grid grid-cols-2 gap-3 mt-3"><label class="bg-slate-800 p-3 rounded-xl">Data<input id="data" type="date" class="mt-1 w-full bg-transparent outline-none [color-scheme:dark]"></label><label class="bg-slate-800 p-3 rounded-xl">Hora<input id="hora" type="time" class="mt-1 w-full bg-transparent outline-none [color-scheme:dark]"></label></div>
<button onclick="confirmar()" class="w-full mt-4 bg-green-500 text-slate-900 font-bold py-4 rounded-xl">Confirmar Registo</button></div></div>
<div id="painel" class="hidden fixed inset-0 bg-black/70 items-center justify-center p-4 z-40"><div class="w-full max-w-sm rounded-3xl bg-white text-slate-800 p-6"><div class="flex justify-between"><span class="text-xs font-black text-green-700">PAINEL PREMIUM</span><button onclick="fecharPainel()">✕</button></div><h2 id="tituloPainel" class="text-2xl font-black mt-3"></h2><p id="textoPainel" class="mt-3 text-sm text-slate-600"></p></div></div>
<script>
if(localStorage.getItem('seringaStatus')!=='premium'){location.href='index.html';}
const quadrantes=[{id:'q1',nome:'Superior Direito'},{id:'q0',nome:'Superior Esquerdo'},{id:'q3',nome:'Inferior Esquerdo'},{id:'q2',nome:'Inferior Direito'}];
let estado=JSON.parse(localStorage.getItem('seringaDados')||'null')||{quadranteAtualIndex:0,doseIndex:0,semanaAtual:1,stockRestante:4};const doses=[2.5,5,7.5,10,12.5,15];
function ui(){quadrantes.forEach(q=>document.getElementById(q.id).className='absolute w-6 h-6 rounded-full bg-slate-600');const q=quadrantes[estado.quadranteAtualIndex];document.getElementById(q.id).className='absolute w-6 h-6 rounded-full bg-green-500 animate-pulse shadow-[0_0_10px_rgba(16,185,129,1)]';document.getElementById('nomeQuadrante').textContent=q.nome;document.getElementById('valorDose').textContent=doses[estado.doseIndex].toFixed(1);document.getElementById('avisoSemana').textContent=`Semana ${estado.semanaAtual} de 4`;document.getElementById('valorStock').textContent=estado.stockRestante;document.getElementById('avisoStock').textContent=estado.stockRestante<=1?'⚠️ Última dose!':'Stock seguro';document.getElementById('avisoStock').className=estado.stockRestante<=1?'text-xs text-red-400':'text-xs text-green-400';}
function salvar(){localStorage.setItem('seringaDados',JSON.stringify(estado));}
function registarAplicacao(){document.getElementById('modalLocal').textContent=quadrantes[estado.quadranteAtualIndex].nome;const n=new Date();document.getElementById('data').value=n.toISOString().slice(0,10);document.getElementById('hora').value=n.toTimeString().slice(0,5);document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');}
function fechar(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex');}
function confirmar(){const historico=JSON.parse(localStorage.getItem('seringaHistorico')||'[]');historico.unshift({data:data.value,hora:hora.value,local:quadrantes[estado.quadranteAtualIndex].nome,dose:dose.value});localStorage.setItem('seringaHistorico',JSON.stringify(historico));estado.stockRestante--;if(estado.stockRestante<1)estado.stockRestante=4;estado.quadranteAtualIndex=(estado.quadranteAtualIndex+1)%quadrantes.length;estado.semanaAtual++;if(estado.semanaAtual>4){estado.semanaAtual=1;}salvar();ui();fechar();alert('Aplicação registada com sucesso. O rodízio avançou para o próximo quadrante.');}
function mostrar(t){const d={hist:['Histórico Ilimitado','Aqui ficam os registos de todas as aplicações guardadas neste dispositivo.'],cal:['Calendário e Lembretes','Organize datas e horários das próximas aplicações.'],stock:['Estoque de Canetas','Acompanhe as doses restantes da caneta e o consumo registado.'],valid:['Avisos de Validade','Registe e reveja datas de validade para os seus itens.']};document.getElementById('tituloPainel').textContent=d[t][0];document.getElementById('textoPainel').textContent=d[t][1];document.getElementById('painel').classList.remove('hidden');document.getElementById('painel').classList.add('flex');}
function fecharPainel(){document.getElementById('painel').classList.add('hidden');document.getElementById('painel').classList.remove('flex');}
function gerarPDF(){window.print();}
function sair(){localStorage.removeItem('seringaStatus');location.href='index.html';}
ui();
</script></body></html>
