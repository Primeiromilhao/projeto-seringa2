<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seringa - Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen p-4 text-white relative">
<header class="flex justify-between items-center mb-6 pt-2">
<div class="flex items-center space-x-2"><span class="text-2xl">💉</span><h1 class="text-2xl font-bold text-green-400">Seringa</h1></div>
<button onclick="sair()" class="bg-slate-800 text-xs font-bold px-4 py-2 rounded-full text-slate-300 border border-slate-700">Sair</button>
</header>
<main>
<div class="bg-[#1e293b] p-6 rounded-2xl mb-4 border border-slate-700">
<h2 class="text-lg font-semibold text-slate-200 mb-4">Próximo local sugerido</h2>
<div class="flex items-center justify-between mb-4">
<div class="w-24 h-32 bg-slate-800 rounded-lg flex items-center justify-center relative border border-slate-600"><span class="text-5xl">🧍</span><div id="marker" class="absolute bottom-6 right-6 w-4 h-4 bg-green-500 rounded-full animate-pulse border-2 border-white"></div></div>
<div class="text-right"><p class="text-xs text-slate-400 mb-1">Depois das aplicações<br>anteriores:</p><p id="nextSite" class="text-xl font-bold text-green-400 mb-2">Coxa Esquerda</p>
<button onclick="proximoLocal()" class="bg-slate-700 text-sm px-4 py-2 rounded-lg flex items-center space-x-2 float-right hover:bg-slate-600"><span>🔄</span><span>Próximo local</span></button></div>
</div>
<button onclick="abrirModal()" class="w-full mt-2 bg-green-500 text-slate-900 font-bold py-4 rounded-xl hover:bg-green-400 transition flex items-center justify-center space-x-2 shadow-lg shadow-green-500/20"><span class="text-2xl transform -rotate-45">💉</span><span class="text-lg">Registar Aplicação Agora</span></button>
</div>
<div class="bg-[#1e293b] rounded-2xl p-2 border border-slate-700 mb-4">
<button onclick="abrirPainel('history')" class="w-full flex justify-between items-center p-4 border-b border-slate-700 hover:bg-slate-800 rounded-t-xl"><div class="flex items-center space-x-3"><span>📋</span><div class="text-left"><p class="font-medium text-slate-200 text-sm">Histórico Ilimitado</p><p class="text-xs text-slate-500">Todas as aplicações registadas</p></div></div><span>›</span></button>
<button onclick="abrirPainel('reminders')" class="w-full flex justify-between items-center p-4 border-b border-slate-700 hover:bg-slate-800"><div class="flex items-center space-x-3"><span>📅</span><div class="text-left"><p class="font-medium text-slate-200 text-sm">Lembretes</p><p class="text-xs text-slate-500">Organize próximas aplicações</p></div></div><span>›</span></button>
<button onclick="abrirPainel('stock')" class="w-full flex justify-between items-center p-4 border-b border-slate-700 hover:bg-slate-800"><div class="flex items-center space-x-3"><span>🖋️</span><div class="text-left"><p class="font-medium text-slate-200 text-sm">Estoque de Canetas</p><p class="text-xs text-slate-500">Controle unidades disponíveis</p></div></div><span>›</span></button>
<button onclick="abrirPainel('validity')" class="w-full flex justify-between items-center p-4 hover:bg-slate-800 rounded-b-xl"><div class="flex items-center space-x-3"><span>⚠️</span><div class="text-left"><p class="font-medium text-amber-400 text-sm">Avisos de Validade</p><p class="text-xs text-slate-500">Confira datas importantes</p></div></div><span>›</span></button>
</div>
<button onclick="gerarPDF()" class="w-full bg-slate-800 text-green-400 border border-green-500/30 font-bold py-4 rounded-xl hover:bg-slate-700 transition flex items-center justify-center space-x-2"><span>📄</span><span>GERAR RELATÓRIO PDF</span></button>
</main>

<div id="modalAplicacao" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
<div class="bg-[#1e293b] w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl relative">
<button onclick="fecharModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
<div class="text-center mb-6"><div class="text-5xl mb-2 transform -rotate-45">💉</div><h3 class="text-xl font-bold text-white">Registar Aplicação</h3></div>
<div class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<div class="bg-slate-800 p-3 rounded-xl border border-slate-600"><label class="text-xs text-slate-400 block mb-1">Dose (mg/UI)</label><input id="dose" type="text" value="20 mg" class="w-full bg-transparent text-white font-bold text-lg focus:outline-none"></div>
<div class="bg-slate-800 p-3 rounded-xl border border-slate-600"><label class="text-xs text-slate-400 block mb-1">Agulha</label><input type="text" value="20 G" class="w-full bg-transparent text-green-400 font-bold text-lg focus:outline-none" readonly></div>
</div>
<div class="bg-slate-800 p-3 rounded-xl border border-slate-600"><label class="text-xs text-slate-400 block mb-1">Local da Injeção</label><div id="modalSite" class="text-white font-medium">Coxa Esquerda</div></div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-slate-800 p-3 rounded-xl border border-slate-600"><label class="text-xs text-slate-400 block mb-1">Data</label><input type="date" id="dataHoje" class="w-full bg-transparent text-white font-medium focus:outline-none [color-scheme:dark]"></div>
<div class="bg-slate-800 p-3 rounded-xl border border-slate-600"><label class="text-xs text-slate-400 block mb-1">Hora</label><input type="time" id="horaAgora" class="w-full bg-transparent text-white font-medium focus:outline-none [color-scheme:dark]"></div>
</div>
<button onclick="confirmarAplicacao()" class="w-full mt-4 bg-green-500 text-slate-900 font-bold py-4 rounded-xl hover:bg-green-400 transition">Confirmar Registo</button>
</div></div></div>

<div id="panel" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-40">
<div class="bg-white text-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl"><div class="flex justify-between"><span class="text-xs font-black text-green-700">PAINEL PREMIUM</span><button onclick="fecharPainel()" class="text-xl">✕</button></div><h2 id="panelTitle" class="mt-3 text-2xl font-black"></h2><div id="panelBody" class="mt-3 text-sm text-slate-600"></div></div></div>
<script>
if(localStorage.getItem('seringaStatus')!=='premium')location.href='index.html';
const sites=['Coxa Esquerda','Abdómen Direito','Abdómen Esquerdo','Coxa Direita','Braço Direito','Braço Esquerdo'];let i=0;
function proximoLocal(){i=(i+1)%sites.length;document.getElementById('nextSite').textContent=sites[i];document.getElementById('modalSite').textContent=sites[i];localStorage.setItem('seringaNextSite',sites[i]);}
function abrirModal(){document.getElementById('modalSite').textContent=document.getElementById('nextSite').textContent;document.getElementById('modalAplicacao').classList.remove('hidden');}
function fecharModal(){document.getElementById('modalAplicacao').classList.add('hidden');}
function confirmarAplicacao(){const r={date:dataHoje.value,time:horaAgora.value,site:modalSite.textContent,dose:dose.value};const h=JSON.parse(localStorage.getItem('seringaRecords')||'[]');h.unshift(r);localStorage.setItem('seringaRecords',JSON.stringify(h.slice(0,100)));fecharModal();alert('Aplicação registada com sucesso.');}
function abrirPainel(type){const data={history:['Histórico Ilimitado','Consulte os registos guardados neste dispositivo.'],reminders:['Lembretes','Organize as próximas aplicações e reveja os lembretes.'],stock:['Estoque de Canetas','Registe e acompanhe as unidades disponíveis.'],validity:['Avisos de Validade','Reveja datas importantes e itens que precisam de atenção.']};panelTitle.textContent=data[type][0];panelBody.textContent=data[type][1];panel.classList.remove('hidden');}
function fecharPainel(){panel.classList.add('hidden');}
function gerarPDF(){window.print();}
function sair(){localStorage.removeItem('seringaStatus');location.href='index.html';}
const savedSite=localStorage.getItem('seringaNextSite');if(savedSite){i=Math.max(0,sites.indexOf(savedSite));nextSite.textContent=savedSite;modalSite.textContent=savedSite;}
const now=new Date();dataHoje.value=now.toISOString().slice(0,10);horaAgora.value=now.toTimeString().slice(0,5);
</script>
<!-- Seringa Premium UI release 3.1 -->
</body>
</html>
